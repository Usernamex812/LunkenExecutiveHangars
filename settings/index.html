<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings — Lunken Executive Hangars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }

        .navbar {
            height: 105px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            border-bottom: 1px solid black;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;

            font-size: 22px;
            font-weight: bold;
            color: black;
            text-decoration: none;
        }

        .logo-mark {
            width: 48px;
            height: 48px;

            background: white;
            color: black;

            border: 2px solid black;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: bold;
            line-height: 12px;
        }

        .logo-mark .e {
            margin-left: 9px;
        }

        .back-button {
            text-decoration: none;
            color: black;

            font-size: 38px;
            font-weight: 300;
            line-height: 1;

            transition: opacity 0.2s;
        }

        .back-button:hover {
            opacity: 0.5;
        }

        .settings-page {
            width: 90%;
            max-width: 1100px;

            margin: 0 auto;

            padding: 60px 0;
        }

        .settings-title {
            font-size: 48px;
            font-weight: 900;

            margin-bottom: 45px;
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 25px 0;

            border-bottom: 1px solid #cccccc;
        }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-name {
            font-size: 20px;
            font-weight: 600;
        }

        .setting-description {
            font-size: 15px;
            color: #666666;
        }

        .switch {
            position: relative;

            width: 54px;
            height: 30px;

            flex-shrink: 0;
            margin-left: 30px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            cursor: pointer;

            background: #cccccc;

            border-radius: 30px;

            transition: 0.2s;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 22px;
            height: 22px;

            left: 4px;
            top: 4px;

            background: white;

            border-radius: 50%;

            transition: 0.2s;
        }

        input:checked + .slider {
            background: black;
        }

        input:checked + .slider::before {
            transform: translateX(24px);
        }

        body.dark {
            background: #111111;
            color: white;
        }

        body.dark .navbar {
            background: #111111;
            border-bottom-color: white;
        }

        body.dark .logo {
            color: white;
        }

        body.dark .logo-mark {
            background: #111111;
            color: white;
            border-color: white;
        }

        body.dark .back-button {
            color: white;
        }

        body.dark .setting {
            border-bottom-color: #444444;
        }

        body.dark .setting-description {
            color: #aaaaaa;
        }

        body.dark .slider {
            background: #555555;
        }

        body.dark input:checked + .slider {
            background: white;
        }

        body.dark input:checked + .slider::before {
            background: #111111;
        }

        @media (max-width: 650px) {

            .navbar {
                height: 90px;
                padding: 0 20px;
            }

            .logo span {
                display: none;
            }

            .settings-page {
                width: 88%;
                padding-top: 40px;
            }

            .settings-title {
                font-size: 38px;
            }

            .setting-description {
                max-width: 230px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <a href="../home/" class="logo">

            <div class="logo-mark">
                <div>L</div>
                <div class="e">E</div>
                <div>H</div>
            </div>

            <span>Lunken Executive Hangars</span>

        </a>

        <a
            href="../home/"
            class="back-button"
            aria-label="Back to Home"
        >
            ←
        </a>

    </header>


    <main class="settings-page">

        <h1 class="settings-title">
            Settings
        </h1>


        <!-- DARK MODE -->

        <div class="setting">

            <div class="setting-info">

                <span class="setting-name">
                    Dark Mode
                </span>

                <span class="setting-description">
                    Use a dark appearance across the website.
                </span>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="darkModeToggle"
                >

                <span class="slider"></span>

            </label>

        </div>


        <!-- RUDE MODE -->

        <div class="setting">

            <div class="setting-info">

                <span class="setting-name">
                    Rude Mode
                </span>

                <span class="setting-description">
                    Changes the Help page into something a little less helpful.
                </span>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="rudeModeToggle"
                >

                <span class="slider"></span>

            </label>

        </div>

    </main>


    <script>

        const darkModeToggle =
            document.getElementById("darkModeToggle");

        const rudeModeToggle =
            document.getElementById("rudeModeToggle");


        /* DARK MODE */

        if (localStorage.getItem("darkMode") === "true") {

            document.body.classList.add("dark");

            darkModeToggle.checked = true;

        }


        darkModeToggle.addEventListener("change", function() {

            if (darkModeToggle.checked) {

                document.body.classList.add("dark");

                localStorage.setItem("darkMode", "true");

            } else {

                document.body.classList.remove("dark");

                localStorage.setItem("darkMode", "false");

            }

        });


        /* RUDE MODE */

        if (localStorage.getItem("rudeMode") === "true") {

            rudeModeToggle.checked = true;

        }


        rudeModeToggle.addEventListener("change", function() {

            if (rudeModeToggle.checked) {

                localStorage.setItem("rudeMode", "true");

            } else {

                localStorage.setItem("rudeMode", "false");

            }

        });

    </script>

</body>
</html>
