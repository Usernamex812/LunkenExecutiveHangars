<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Lunken Executive Hangars</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      transition: background 0.25s, color 0.25s;
    }

    header {
      height: 105px;
      border-bottom: 2px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border: 3px solid #111;
      position: relative;
      flex-shrink: 0;
    }

    .logo-l {
      position: absolute;
      left: 8px;
      top: 8px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .logo-e {
      position: absolute;
      left: 20px;
      top: 17px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .logo-h {
      position: absolute;
      right: 7px;
      bottom: 6px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .company-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .settings-icon {
      font-size: 21px;
      text-decoration: none;
      line-height: 1;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 70px 25px;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 45px;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 25px 0;
      border-bottom: 1px solid #ccc;
      gap: 30px;
    }

    .setting:first-of-type {
      border-top: 1px solid #ccc;
    }

    .setting-info h2 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .setting-info p {
      margin: 0;
      color: #666;
      line-height: 1.5;
    }

    .toggle {
      position: relative;
      width: 58px;
      height: 32px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #aaa;
      border-radius: 32px;
      cursor: pointer;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 4px;
      top: 4px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked + .slider {
      background: #111;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(26px);
    }

    body.dark-mode {
      background: #111;
      color: #eee;
    }

    body.dark-mode header {
      background: #111;
      border-color: #eee;
    }

    body.dark-mode nav a {
      color: #eee;
    }

    body.dark-mode .setting {
      border-color: #444;
    }

    body.dark-mode .setting-info p {
      color: #aaa;
    }

    body.dark-mode .toggle input:checked + .slider {
      background: #eee;
    }

    body.dark-mode .toggle input:checked + .slider:before {
      background: #111;
    }

    @media (max-width: 900px) {
      header {
        padding: 0 20px;
      }

      .company-name {
        display: none;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 13px;
      }
    }

    @media (max-width: 650px) {
      header {
        height: auto;
        min-height: 85px;
        padding: 15px;
        flex-wrap: wrap;
        gap: 15px;
      }

      nav {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      main {
        padding: 45px 20px;
      }

      h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">
      <span class="logo-l">L</span>
      <span class="logo-e">E</span>
      <span class="logo-h">H</span>
    </div>

    <div class="company-name">LUNKEN EXECUTIVE HANGARS</div>
  </div>

  <nav>
    <a href="../home/">Home</a>
    <a href="../products/">Products</a>
    <a href="../mission/">Mission</a>
    <a href="../contact/">Contact</a>
    <a href="../help/">Help</a>
    <a href="../settings/" class="settings-icon" title="Settings">⚙</a>
    <a href="../account/">Account</a>
  </nav>
</header>

<main>

  <h1>Settings</h1>

  <div class="setting">

    <div class="setting-info">
      <h2>Dark Mode</h2>
      <p>
        Switch the website between light and dark appearance.
      </p>
    </div>

    <label class="toggle">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>

  </div>

  <div class="setting">

    <div class="setting-info">
      <h2>Rude Mode</h2>
      <p>
        Changes the Help page into something a little less helpful.
      </p>
    </div>

    <label class="toggle">
      <input type="checkbox" id="rudeModeToggle">
      <span class="slider"></span>
    </label>

  </div>

</main>

<script>
  const darkModeToggle =
    document.getElementById("darkModeToggle");

  const rudeModeToggle =
    document.getElementById("rudeModeToggle");

  const darkMode =
    localStorage.getItem("darkMode") === "true";

  const rudeMode =
    localStorage.getItem("rudeMode") === "true";

  darkModeToggle.checked = darkMode;
  rudeModeToggle.checked = rudeMode;

  if (darkMode) {
    document.body.classList.add("dark-mode");
  }

  darkModeToggle.addEventListener("change", () => {
    const enabled = darkModeToggle.checked;

    localStorage.setItem("darkMode", enabled);

    document.body.classList.toggle(
      "dark-mode",
      enabled
    );
  });

  rudeModeToggle.addEventListener("change", () => {
    localStorage.setItem(
      "rudeMode",
      rudeModeToggle.checked
    );
  });
</script>

</body>
</html>
