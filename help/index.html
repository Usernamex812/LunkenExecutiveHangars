<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Help — Lunken Executive Hangars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }

        .navbar {
            height: 105px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            border-bottom: 1px solid black;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;

            font-size: 22px;
            font-weight: bold;
            color: black;

            text-decoration: none;
        }

        .logo-mark {
            width: 48px;
            height: 48px;

            background: white;
            color: black;

            border: 2px solid black;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: bold;
            line-height: 12px;
        }

        .logo-mark .e {
            margin-left: 9px;
        }

        .back-button {
            text-decoration: none;
            color: black;

            font-size: 38px;
            font-weight: 300;
            line-height: 1;

            transition: opacity 0.2s;
        }

        .back-button:hover {
            opacity: 0.5;
        }

        /* MAIN HELP MESSAGE */

        .help-message {
            min-height: calc(100vh - 105px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 30px;
        }

        .help-text {
            font-size: clamp(42px, 6vw, 86px);
            font-weight: 900;

            line-height: 1.05;
            letter-spacing: -0.025em;
        }

        .help-image {
            width: clamp(180px, 25vw, 330px);
            height: auto;

            margin: 35px 0;

            display: block;
        }

        /* DARK MODE */

        body.dark {
            background: #111111;
            color: white;
        }

        body.dark .navbar {
            background: #111111;
            border-bottom-color: white;
        }

        body.dark .logo {
            color: white;
        }

        body.dark .logo-mark {
            background: #111111;
            color: white;
            border-color: white;
        }

        body.dark .back-button {
            color: white;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                height: 90px;
                padding: 0 20px;
            }

            .logo span {
                display: none;
            }

            .help-message {
                min-height: calc(100vh - 90px);
                padding: 40px 20px;
            }

            .help-text {
                font-size: clamp(34px, 10vw, 60px);
            }

            .help-image {
                width: 210px;
                margin: 25px 0;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <a href="../home/" class="logo">

            <div class="logo-mark">
                <div>L</div>
                <div class="e">E</div>
                <div>H</div>
            </div>

            <span>Lunken Executive Hangars</span>

        </a>

        <a
            href="../home/"
            class="back-button"
            aria-label="Back to Home"
        >
            ←
        </a>

    </header>


    <main class="help-message">

        <div class="help-text">
            The helping hand you seek
        </div>

        <img
            class="help-image"
            src="https://th.bing.com/th/id/R.5e179ed43791bb3b152b723c5910e25b?rik=URncfTRIQRyw3A&riu=http%3a%2f%2fwww.clipartbest.com%2fcliparts%2fLTK%2fzr9%2fLTKzr95yc.jpg&ehk=hV2SG8gbB%2bFRvOtRW1AJZFCAaW2cLu7nngBC3iEDd3c%3d&risl=&pid=ImgRaw&r=0"
            alt="Helping hand"
        >

        <div class="help-text">
            Is at the end of your arm.
        </div>

    </main>


    <script>

        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
        }

    </script>

</body>
</html>
