<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunken Executive Hangars</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #111;
  transition: background 0.25s, color 0.25s;
}

/* HEADER */

header {
  height: 105px;
  width: 100%;
  display: flex;
  align-items: center;
  padding: 0 32px;
  border-bottom: 2px solid #111;
  background: #fff;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-shrink: 0;
}

/* LEH LOGO */

.logo {
  width: 58px;
  height: 58px;
  border: 3px solid #111;
  position: relative;
  flex-shrink: 0;
}

.logo-l {
  position: absolute;
  left: 8px;
  top: 8px;
  font-size: 25px;
  font-weight: bold;
  line-height: 1;
}

.logo-e {
  position: absolute;
  left: 20px;
  top: 17px;
  font-size: 25px;
  font-weight: bold;
  line-height: 1;
}

.logo-h {
  position: absolute;
  right: 7px;
  bottom: 6px;
  font-size: 25px;
  font-weight: bold;
  line-height: 1;
}

.company-name {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 1px;
  white-space: nowrap;
}

/* NAV */

nav {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 27px;
}

nav a {
  color: #111;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}

nav a:hover {
  text-decoration: underline;
}

.settings-icon {
  font-size: 23px;
  line-height: 1;
  text-decoration: none !important;
}

/* HERO */

.hero {
  position: relative;
  width: 100%;
  height: calc(100vh - 105px);
  min-height: 500px;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-align: center;
  font-size: clamp(36px, 5vw, 72px);
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow:
    0 3px 8px rgba(0,0,0,0.8),
    0 1px 3px rgba(0,0,0,0.9);
  white-space: nowrap;
}

/* DARK MODE */

body.dark {
  background: #111;
  color: #eee;
}

body.dark header {
  background: #111;
  border-color: #eee;
}

body.dark .logo {
  border-color: #eee;
}

body.dark nav a {
  color: #eee;
}

/* MOBILE */

@media (max-width: 850px) {
  header {
    padding: 0 20px;
  }

  .company-name {
    font-size: 16px;
  }

  nav {
    gap: 15px;
  }
}

@media (max-width: 700px) {
  header {
    height: auto;
    min-height: 105px;
    padding: 20px;
    flex-wrap: wrap;
    gap: 20px;
  }

  nav {
    width: 100%;
    margin-left: 0;
    justify-content: center;
    flex-wrap: wrap;
  }

  .hero {
    height: calc(100vh - 160px);
  }

  .hero-title {
    white-space: normal;
    width: 90%;
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="logo">
      <span class="logo-l">L</span>
      <span class="logo-e">E</span>
      <span class="logo-h">H</span>
    </div>

    <div class="company-name">
      LUNKEN EXECUTIVE HANGARS
    </div>

  </div>

  <nav>
    <a href="../home/">Home</a>
    <a href="../products/">Products</a>
    <a href="../mission/">Mission</a>
    <a href="../contact/">Contact</a>
    <a href="../help/">Help</a>
    <a href="../settings/" class="settings-icon" title="Settings">⚙</a>
    <a href="../account/">Account</a>
  </nav>

</header>

<section class="hero">

  <img
    src="https://resources.globalair.com/images/article/phenom-300e-1.jpg"
    alt="Embraer Phenom 300E"
  >

  <div class="hero-title">
    LUNKEN EXECUTIVE HANGARS
  </div>

</section>

<script>
const darkMode = localStorage.getItem("darkMode") === "true";

if (darkMode) {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
