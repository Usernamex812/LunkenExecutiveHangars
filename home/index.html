<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help | Lunken Executive Hangars</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #111;
    transition: background 0.25s, color 0.25s;
  }

  /* =========================
     TOP BAR
     ========================= */

  header {
    height: 105px;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 32px;
    border-bottom: 2px solid #111;
    background: #fff;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  /* LEH LOGO */

  .logo {
    width: 58px;
    height: 58px;
    border: 3px solid #111;
    position: relative;
    flex-shrink: 0;
  }

  .logo-l {
    position: absolute;
    left: 8px;
    top: 8px;
    font-size: 25px;
    font-weight: bold;
    line-height: 1;
  }

  .logo-e {
    position: absolute;
    left: 20px;
    top: 17px;
    font-size: 25px;
    font-weight: bold;
    line-height: 1;
  }

  .logo-h {
    position: absolute;
    right: 7px;
    bottom: 6px;
    font-size: 25px;
    font-weight: bold;
    line-height: 1;
  }

  .company-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* NAVIGATION */

  nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 27px;
  }

  nav a {
    color: #111;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .settings-icon {
    font-size: 23px;
    line-height: 1;
    text-decoration: none !important;
  }

  /* =========================
     HELP CONTENT
     ========================= */

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 70px 30px;
  }

  h1 {
    text-align: center;
    font-size: 42px;
    margin: 0 0 45px;
  }

  .help-box {
    border: 1px solid #ccc;
    padding: 30px;
    border-radius: 8px;
  }

  .help-box h2 {
    margin-top: 0;
  }

  .help-box p {
    line-height: 1.6;
  }

  /* =========================
     DARK MODE
     ========================= */

  body.dark {
    background: #111;
    color: #eee;
  }

  body.dark header {
    background: #111;
    border-color: #eee;
  }

  body.dark .logo {
    border-color: #eee;
  }

  body.dark nav a {
    color: #eee;
  }

  body.dark .help-box {
    border-color: #555;
  }

  /* =========================
     RUDE MODE
     ========================= */

  #rudeMessage {
    display: none;
    min-height: 55vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    font-size: 48px;
    font-weight: bold;
    line-height: 1.25;
  }

  body.rude #normalHelp {
    display: none;
  }

  body.rude #rudeMessage {
    display: flex;
  }

  @media (max-width: 1000px) {
    header {
      padding: 0 20px;
    }

    nav {
      gap: 16px;
    }

    .company-name {
      font-size: 16px;
    }
  }

  @media (max-width: 800px) {
    header {
      height: auto;
      min-height: 105px;
      padding: 20px;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav {
      margin-left: 0;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      padding-bottom: 5px;
    }

    .company-name {
      font-size: 15px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="brand">

    <div class="logo">
      <span class="logo-l">L</span>
      <span class="logo-e">E</span>
      <span class="logo-h">H</span>
    </div>

    <div class="company-name">
      LUNKEN EXECUTIVE HANGARS
    </div>

  </div>

  <nav>
    <a href="../home/">Home</a>
    <a href="../products/">Products</a>
    <a href="../mission/">Mission</a>
    <a href="../contact/">Contact</a>
    <a href="../help/">Help</a>
    <a href="../settings/" class="settings-icon" title="Settings">⚙</a>
    <a href="../account/">Account</a>
  </nav>
</header>

<main>

  <div id="normalHelp">

    <h1>Help</h1>

    <div class="help-box">
      <h2>How can we help?</h2>
      <p>
        If you have questions about Lunken Executive Hangars,
        please contact us and we'll be happy to help.
      </p>
    </div>

  </div>

  <div id="rudeMessage">
    <div>The helping hand you seek</div>
    <div>Is at the end of your arm.</div>
  </div>

</main>

<script>
  const darkMode = localStorage.getItem("darkMode") === "true";
  const rudeMode = localStorage.getItem("rudeMode") === "true";

  if (darkMode) {
    document.body.classList.add("dark");
  }

  if (rudeMode) {
    document.body.classList.add("rude");
  }
</script>

</body>
</html>
