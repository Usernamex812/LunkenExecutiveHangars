<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunken Executive Hangars</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      transition: background 0.25s, color 0.25s;
    }

    header {
      height: 105px;
      border-bottom: 2px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border: 3px solid #111;
      position: relative;
      flex-shrink: 0;
    }

    .logo-l {
      position: absolute;
      left: 8px;
      top: 8px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .logo-e {
      position: absolute;
      left: 20px;
      top: 17px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .logo-h {
      position: absolute;
      right: 7px;
      bottom: 6px;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;
    }

    .company-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .settings-icon {
      font-size: 21px;
      text-decoration: none;
      line-height: 1;
    }

    .hero {
      min-height: calc(100vh - 105px);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-image:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("https://resources.globalair.com/images/article/phenom-300e-1.jpg");
      background-size: cover;
      background-position: center;
      padding: 40px 20px;
    }

    .hero-content {
      color: white;
      max-width: 1000px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 88px);
      margin: 0;
      font-weight: 800;
      letter-spacing: 3px;
    }

    body.dark-mode {
      background: #111;
      color: #eee;
    }

    body.dark-mode header {
      background: #111;
      border-color: #eee;
    }

    body.dark-mode nav a {
      color: #eee;
    }

    @media (max-width: 900px) {
      header {
        padding: 0 20px;
      }

      .company-name {
        display: none;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 13px;
      }
    }

    @media (max-width: 650px) {
      header {
        height: auto;
        min-height: 85px;
        padding: 15px;
        flex-wrap: wrap;
        gap: 15px;
      }

      nav {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      .hero {
        min-height: calc(100vh - 120px);
      }

      .hero h1 {
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">
      <span class="logo-l">L</span>
      <span class="logo-e">E</span>
      <span class="logo-h">H</span>
    </div>

    <div class="company-name">LUNKEN EXECUTIVE HANGARS</div>
  </div>

  <nav>
    <a href="../home/">Home</a>
    <a href="../products/">Products</a>
    <a href="../mission/">Mission</a>
    <a href="../contact/">Contact</a>
    <a href="../help/">Help</a>
    <a href="../settings/" class="settings-icon" title="Settings">⚙</a>
    <a href="../account/">Account</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>LUNKEN EXECUTIVE HANGARS</h1>
  </div>
</section>

<script>
  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark-mode");
  }
</script>

</body>
</html>
