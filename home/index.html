<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunken Executive Hangars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        /* =========================
           TOP BAR
        ========================= */

        .navbar {
            height: 105px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            border-bottom: 1px solid black;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;

            font-size: 22px;
            font-weight: bold;
            color: black;
        }

        .logo-mark {
            width: 48px;
            height: 48px;

            background: white;
            color: black;

            border: 2px solid black;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: bold;
            line-height: 12px;
        }

        .logo-mark .e {
            margin-left: 9px;
        }

        /* =========================
           RIGHT NAVIGATION
        ========================= */

        .right-side {
            height: 100%;

            display: flex;
            align-items: center;
        }

        .nav-links {
            height: 100%;

            display: flex;
            align-items: center;

            list-style: none;
        }

        .nav-links li {
            height: 100%;

            display: flex;
            align-items: center;

            position: relative;
        }

        /* Divider lines */

        .nav-links li + li::before {
            content: "";

            position: absolute;
            left: 0;

            height: 42px;

            width: 1px;

            background: black;
        }

        .nav-links a {
            text-decoration: none;
            color: black;

            font-size: 18px;
            font-weight: 600;

            padding: 0 28px;

            white-space: nowrap;

            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        /* =========================
           SETTINGS
        ========================= */

        .settings {
            height: 42px;

            display: flex;
            align-items: center;

            padding-left: 28px;
            margin-left: 0;

            border-left: 1px solid black;

            text-decoration: none;
            color: black;

            font-size: 27px;
            line-height: 1;

            transition: opacity 0.2s;
        }

        .settings:hover {
            opacity: 0.5;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            width: 92%;
            max-width: 1400px;

            margin: 0 auto;

            padding: 55px 0 60px;
        }

        .hero-title {
            width: 100%;

            text-align: center;

            font-size: clamp(28px, 5vw, 72px);
            font-weight: 900;

            letter-spacing: 0.025em;
            line-height: 1;

            white-space: nowrap;

            margin-bottom: 35px;
        }

        .hero-image {
            width: 100%;
            height: auto;

            display: block;
        }

        /* =========================
           DARK MODE
        ========================= */

        body.dark {
            background: #111111;
            color: white;
        }

        body.dark .navbar {
            background: #111111;
            border-bottom-color: white;
        }

        body.dark .logo {
            color: white;
        }

        body.dark .logo-mark {
            background: #111111;
            color: white;
            border-color: white;
        }

        body.dark .nav-links a,
        body.dark .settings {
            color: white;
        }

        body.dark .nav-links li + li::before,
        body.dark .settings {
            border-color: white;
        }

        body.dark .hero-title {
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .navbar {
                padding: 0 20px;
            }

            .logo span {
                display: none;
            }

            .nav-links a {
                font-size: 14px;
                padding: 0 14px;
            }

            .settings {
                padding-left: 16px;
            }
        }

        @media (max-width: 650px) {

            .navbar {
                height: 90px;
            }

            .nav-links a {
                font-size: 12px;
                padding: 0 8px;
            }

            .settings {
                padding-left: 10px;
                font-size: 23px;
            }

            .hero {
                width: 94%;
                padding-top: 40px;
            }

            .hero-title {
                font-size: clamp(22px, 6vw, 40px);
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-mark">
                <div>L</div>
                <div class="e">E</div>
                <div>H</div>
            </div>

            <span>Lunken Executive Hangars</span>

        </div>


        <div class="right-side">

            <nav>
                <ul class="nav-links">

                    <li>
                        <a href="#">Our Products</a>
                    </li>

                    <li>
                        <a href="#">Our Mission</a>
                    </li>

                    <li>
                        <a href="#">Contact Us</a>
                    </li>

                    <li>
                        <a href="#">Help</a>
                    </li>

                </ul>
            </nav>

            <a href="../settings/" class="settings" aria-label="Settings">⚙</a>

        </div>

    </header>


    <!-- HERO -->

    <main class="hero">

        <h1 class="hero-title">
            LUNKEN EXECUTIVE HANGARS
        </h1>

        <img
            class="hero-image"
            src="https://resources.globalair.com/images/article/phenom-300e-1.jpg"
            alt="Embraer Phenom 300E"
        >

    </main>


    <!-- DARK MODE -->

    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
        }
    </script>

</body>
</html>
