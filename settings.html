<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Lunken Executive Hangars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }

        .navbar {
            height: 80px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            border-bottom: 1px solid black;
        }

        .back {
            text-decoration: none;
            color: black;
            font-size: 15px;
            font-weight: 600;
        }

        .settings-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 30px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 0;
            border-bottom: 1px solid #ccc;
        }

        .setting-name {
            font-size: 18px;
            font-weight: 600;
        }

        /* Toggle */
        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #ccc;
            border-radius: 28px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #222;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Dark Mode */
        body.dark {
            background: #111111;
            color: white;
        }

        body.dark .navbar {
            background: #111111;
            border-bottom-color: white;
        }

        body.dark .back {
            color: white;
        }

        body.dark .setting {
            border-bottom-color: #444;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="back">← Back</a>
    </header>

    <main class="settings-container">

        <h1>Settings</h1>

        <div class="setting">
            <span class="setting-name">Dark Mode</span>

            <label class="switch">
                <input type="checkbox" id="darkMode">
                <span class="slider"></span>
            </label>
        </div>

    </main>

    <script>
        const toggle = document.getElementById("darkMode");

        if (localStorage.getItem("darkMode") === "true") {
            toggle.checked = true;
            document.body.classList.add("dark");
        }

        toggle.addEventListener("change", function () {
            if (this.checked) {
                document.body.classList.add("dark");
                localStorage.setItem("darkMode", "true");
            } else {
                document.body.classList.remove("dark");
                localStorage.setItem("darkMode", "false");
            }
        });
    </script>

</body>
</html>
