<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunken Executive Hangars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        /* =========================
           TOP BAR
        ========================= */

        .navbar {
            height: 80px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid black;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            background: white;
            color: black;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            line-height: 11px;
        }

        .logo-mark .e {
            margin-left: 8px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .right-side {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        /* =========================
           SETTINGS
        ========================= */

        .settings {
            text-decoration: none;
            color: black;
            font-size: 25px;
            line-height: 1;
        }

        .settings:hover {
            opacity: 0.5;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;
            padding: 45px 50px;
            display: flex;
            justify-content: center;
            background: white;
        }

        .hero-image {
            width: 85%;
            max-width: 1500px;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        /* =========================
           DARK MODE
        ========================= */

        body.dark {
            background: #111111;
            color: white;
        }

        body.dark .navbar {
            background: #111111;
            border-bottom-color: white;
        }

        body.dark .logo {
            color: white;
        }

        body.dark .logo-mark {
            background: #111111;
            color: white;
            border-color: white;
        }

        body.dark .nav-links a,
        body.dark .settings {
            color: white;
        }

        body.dark .hero {
            background: #111111;
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <header class="navbar">

        <div class="logo">

            <div class="logo-mark">
                <div>L</div>
                <div class="e">E</div>
                <div>H</div>
            </div>

            <span>Lunken Executive Hangars</span>

        </div>

        <div class="right-side">

            <nav>
                <ul class="nav-links">
                    <li><a href="#">Hangars</a></li>
                    <li><a href="#">Amenities</a></li>
                    <li><a href="#">Location</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

            <a href="settings.html" class="settings" aria-label="Settings">⚙</a>

        </div>

    </header>


    <!-- MAIN IMAGE -->
    <main class="hero">

        <img
            class="hero-image"
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Embraer_Phenom_300E_exterior.jpg"
            alt="Embraer Phenom 300E"
        >

    </main>


    <!-- LOAD SAVED DARK MODE -->
    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
        }
    </script>

</body>
</html>
